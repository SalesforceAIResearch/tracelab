[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracelab"
version = "0.1.0"
authors = [{name = "Egor Pakhomov"}, {name = "Erik Nijkamp"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
description = "Live trace model for long-horizon LLM agents: ledger, run-state, derived artifacts, views"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "watchfiles>=0.21",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.4"]

[project.scripts]
tracelab = "tracelab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
